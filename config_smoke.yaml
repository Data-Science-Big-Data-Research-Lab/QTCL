experiment_name: "qtcl_smoke"
output_dir: "./results_smoke"
device: "auto"

seeds: [42]

datasets:
  - name: "split_mnist"
    root: "./data/datasets"
    n_tasks: 2
    image_size: 32
    subset_fraction: 0.05
    train_test_split: 0.8
    train_val_split: 0.8

  - name: "split_cifar10"
    root: "./data/datasets"
    n_tasks: 2
    image_size: 32
    subset_fraction: 0.05
    train_test_split: 0.8
    train_val_split: 0.8

  - name: "split_cifar100"
    root: "./data/datasets"
    n_tasks: 2
    image_size: 32
    subset_fraction: 0.05
    train_test_split: 0.8
    train_val_split: 0.8

backbones:
  - name: "resnet18"
    feature_dim: 512
    frozen: true
  - name: "mobilenetv2"
    feature_dim: 1280
    frozen: true
  - name: "efficientnet_b0"
    feature_dim: 1280
    frozen: true

heads:
  - name: "mlp"
    type: "classical"
    hidden_dim: 64
    dropout: 0.3
  - name: "qk_ideal"
    type: "qiskit"
    backend: "statevector"
    n_qubits: 2
    depth: 1
    noise: false
    fusion_method: "concat"
  - name: "qk_noisy"
    type: "qiskit"
    backend: "aer"
    n_qubits: 2
    depth: 1
    noise: true
    shots: 256
    gradient_method: "spsa"
    fusion_method: "concat"
    noise_params:
      T1_us: 250
      T2_us: 150
      t1q_ns: 32
      t2q_ns: 68
      p1q: 0.0002
      p2q: 0.005
      readout_error: 0.012

ewc:
  lambda: 1000
  fisher_samples: 50

training:
  optimizer: "adam"
  lr: 0.001
  batch_size: 32
  epochs_per_task: 2
  loss: "cross_entropy"
  scheduler:
    type: "step_lr"
    step_size: 3
    gamma: 0.9
