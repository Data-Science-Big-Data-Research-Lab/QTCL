# =============================================================
# QTCL — Quantum Transfer-Continual Learning
# Configuration File
# =============================================================
experiment_name: "qtcl_v1"
output_dir: "./results"
device: "auto"

# =============================================================
# RANDOM SEEDS
# =============================================================
seeds: [0, 42, 123, 456, 789]

# =============================================================
# DATASETS
# =============================================================
datasets:
  - name: "split_mnist"
    root: "./data/datasets"
    n_tasks: 5
    image_size: 32
    # 10% subset of full data → 80% train+val / 20% test → 80/20 train/val
    subset_fraction: 0.1
    train_test_split: 0.8     # 80% of subset → train+val, 20% → test
    train_val_split: 0.8      # 80% of train+val → train, 20% → val

  - name: "split_cifar10"
    root: "./data/datasets"
    n_tasks: 5
    image_size: 32
    subset_fraction: 0.1
    train_test_split: 0.8
    train_val_split: 0.8

# =============================================================
# BACKBONES (ImageNet-pretrained, frozen)
# =============================================================
backbones:
  - name: "resnet18"
    feature_dim: 512
    frozen: true
  - name: "mobilenetv2"
    feature_dim: 1280
    frozen: true
  - name: "efficientnet_b0"
    feature_dim: 1280
    frozen: true

# =============================================================
# CLASSIFICATION HEADS
# =============================================================
heads:
  # --- Classical baselines ---
  - name: "linear"
    type: "classical"
    description: "Single linear layer (no hidden)"
    variant: "linear"

  - name: "mlp"
    type: "classical"
    description: "MLP (128 hidden, ReLU, Dropout 0.3)"
    variant: "mlp"
    hidden_dim: 128
    dropout: 0.3

  - name: "mlp_deep"
    type: "classical"
    description: "Two-hidden-layer MLP (128 -> 64)"
    variant: "mlp_deep"
    hidden_dim: 128
    dropout: 0.3

  # --- Qiskit Hybrid Quantum-Classical ---
  - name: "qk_ideal"
    type: "qiskit"
    description: "Qiskit dual-path hybrid (StatevectorEstimator, exact)"
    backend: "statevector"
    n_qubits: 4
    depth: 1
    noise: false
    fusion_method: "concat"

  - name: "qk_noisy"
    type: "qiskit"
    description: "Qiskit dual-path hybrid (AerSimulator, IBM Heron r2 noise model)"
    backend: "aer"
    n_qubits: 4
    depth: 1
    noise: true
    shots: 1024
    gradient_method: "spsa"
    ansatz: "circular"
    fusion_method: "concat"
    noise_params:
      T1_us: 250
      T2_us: 150
      t1q_ns: 32
      t2q_ns: 68
      p1q: 0.0002
      p2q: 0.005
      readout_error: 0.012

  # --- Quantum ansatz variants (for arch_variants study) ---
  - name: "qk_linear"
    type: "qiskit"
    description: "VQC with linear CNOT entanglement"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "linear"
    fusion_method: "add"

  - name: "qk_no_ent"
    type: "qiskit"
    description: "VQC with NO entanglement"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "no_ent"
    fusion_method: "add"

  - name: "qk_real_amp"
    type: "qiskit"
    description: "RealAmplitudes ansatz"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "real_amp"
    fusion_method: "add"

  - name: "qk_efficient_su2"
    type: "qiskit"
    description: "EfficientSU2 ansatz"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "efficient_su2"
    fusion_method: "add"

  - name: "qk_two_local"
    type: "qiskit"
    description: "TwoLocal ansatz"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "two_local"
    fusion_method: "add"

  - name: "qk_re_upload"
    type: "qiskit"
    description: "Data re-uploading VQC"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "re_upload"
    fusion_method: "add"

  - name: "qk_ideal_concat"
    type: "qiskit"
    description: "Qiskit circular VQC with concat fusion"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "circular"
    fusion_method: "concat"

  - name: "qk_ideal_su2_concat"
    type: "qiskit"
    description: "Qiskit efficient_su2 VQC with concat fusion"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "efficient_su2"
    fusion_method: "concat"

  - name: "qk_ideal_re_upload_concat"
    type: "qiskit"
    description: "Qiskit re_upload VQC with concat fusion"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "re_upload"
    fusion_method: "concat"

  - name: "qk_noisy_linear"
    type: "qiskit"
    backend: "aer"
    n_qubits: 4
    depth: 2
    noise: true
    shots: 1024
    gradient_method: "spsa"
