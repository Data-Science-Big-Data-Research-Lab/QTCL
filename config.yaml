# =============================================================
# EWC HYPERPARAMETERS
# =============================================================
ewc:
  lambda: 5000
  fisher_samples: 200
  buffer_size: 200          # for replay method

# Default CL method ('naive' | 'l2' | 'ewc' | 'si' | 'derpp' | 'replay')
cl_method: "derpp"

# Best parameters found from sensitivity grid search: alpha=0.7, beta=0.7
derpp:
  alpha: 0.7
  beta: 0.7

# =============================================================
# TRAINING HYPERPARAMETERS
# =============================================================
training:
  optimizer: "adam"
  lr: 0.001
  batch_size: 32
  epochs_per_task: 5
  loss: "cross_entropy"
  scheduler:
    type: "step_lr"
    step_size: 3
    gamma: 0.9

# =============================================================
# ADDITIONAL STUDIES
# =============================================================

# --- Ablation: circuit depth and n_qubits ---
# Quick sweep for local execution: qubits 2,4,6,8 and depths 1,2,3.
ablation:
  enabled: true
  datasets: ["split_mnist"]
  backbones: ["resnet18"]
  heads: ["qk_ideal"]
  qubits: [2, 4, 6, 8]
  depths: [1, 2, 3]
  extra_qubits: []
  seeds: [42]

# --- EWC Lambda Sensitivity ---
lambda_sensitivity:
  enabled: false
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18", "mobilenetv2", "efficientnet_b0"]
  heads: ["mlp", "qk_ideal", "qk_noisy"]
  lambdas: [0, 100, 500, 1000, 5000, 10000, 50000]
  seeds: [42]

# --- DER++ Alpha/Beta Sensitivity ---
derpp_sensitivity:
  enabled: true
  datasets: ["split_cifar10"]
  backbones: ["resnet18"]
  heads: ["mlp", "qk_ideal", "qk_noisy"]
  alphas: [0.1, 0.3, 0.5, 0.7, 1.0]
  betas: [0.1, 0.3, 0.5, 0.7, 1.0]
  seeds: [42]

# --- Scalability: number of sequential tasks ---
scalability:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18", "mobilenetv2", "efficientnet_b0"]
  heads: ["mlp", "qk_ideal", "qk_noisy"]
  seeds: [42, 123]

# --- CL methods comparison: naive, L2, EWC, SI, MAS, replay ---
cl_methods_study:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18", "mobilenetv2", "efficientnet_b0"]
  heads: ["mlp", "qk_ideal", "qk_noisy"]
  methods: ["naive", "l2", "ewc", "si", "derpp", "replay"]
  seeds: [0, 42, 123, 456, 789]

# --- Architecture variants: classical and quantum ansatz comparison ---
arch_variants:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18", "mobilenetv2", "efficientnet_b0"]
  heads: ["linear", "mlp", "mlp_deep",
          "qk_ideal", "qk_linear", "qk_no_ent",
          "qk_real_amp", "qk_efficient_su2", "qk_two_local", "qk_re_upload",
          "qk_ideal_concat", "qk_ideal_su2_concat", "qk_ideal_re_upload_concat",
          "qk_noisy", "qk_noisy_linear", "qk_noisy_no_ent",
          "qk_noisy_real_amp", "qk_noisy_efficient_su2", "qk_noisy_two_local", "qk_noisy_re_upload",
          "qk_noisy_concat", "qk_noisy_su2_concat", "qk_noisy_re_upload_concat"]
  seeds: [0, 42, 123, 456, 789]

# --- Noise Decomposition: impact per channel ---
noise_decomposition:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18", "mobilenetv2", "efficientnet_b0"]
  base_head: "qk_noisy"
  channels:
    - name: "amplitude_damping"
      noise_channels: ["amplitude_damping"]
    - name: "phase_damping"
      noise_channels: ["phase_damping"]
    - name: "depolarizing"
      noise_channels: ["depolarizing"]
  n_qubits: 4
  depth: 1
  seeds: [42]

# --- Noise Mitigation Study ---
noise_mitigation_study:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18", "mobilenetv2", "efficientnet_b0"]
  heads: ["qk_noisy"]
  mitigations: ["none", "trex", "dd", "zne", "pec"]
  seeds: [0, 42, 123, 456, 789]

# --- SPSA Stochastic Gradient Variants ---
spsa_variants_study:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18", "mobilenetv2", "efficientnet_b0"]
  heads: ["qk_noisy"]
  variants: ["spsa", "2-spsa", "qnspsa", "spsa_adam"]
  seeds: [0, 42, 123, 456, 789]

# --- Real Hardware Study ---
realhardware:
  enabled: false
  datasets: ["split_cifar10"]
  backbones: ["resnet18"]
  heads: ["qk_noisy"]
  mitigations: ["dd"]
  seeds: [0, 42, 123, 456, 789]

# =============================================================
# VISUALIZATION
# =============================================================
visualization:
  enabled: true
  plots_subdir: "plots"
  dpi: 150

# =============================================================
# CHECKPOINTS
# =============================================================
checkpoints:
  enabled: true
  save_best: true
  save_last: true
  resume: true
